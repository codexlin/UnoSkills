# git-cliff configuration for UnoSkills automatic release notes.
# Used by `.github/workflows/release.yml` whenever a release tag does not have
# a hand-curated section in `CHANGELOG.md`.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/codexlin/UnoSkills/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactor" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore|^ci|^build|^style", group = "<!-- 6 -->🔧 Maintenance & CI" },
  { body = ".*", group = "<!-- 7 -->📝 Other Changes" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"

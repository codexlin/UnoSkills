name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-arm64
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shm0-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Build release binaries (app + cli)
        run: |
          cargo build --release --target ${{ matrix.target }} -p unoskills-app -p unoskills-cli --locked

      - name: Package release artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/unoskills-app${{ matrix.ext }}" "dist/unoskills-app-${{ matrix.artifact_suffix }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/unoskills${{ matrix.ext }}" "dist/unoskills-${{ matrix.artifact_suffix }}${{ matrix.ext }}"
          if [ "${{ runner.os }}" != "Windows" ]; then
            tar -czf "dist/unoskills-${{ matrix.artifact_suffix }}.tar.gz" -C dist \
              "unoskills-app-${{ matrix.artifact_suffix }}" \
              "unoskills-${{ matrix.artifact_suffix }}"
          else
            7z a "dist/unoskills-${{ matrix.artifact_suffix }}.zip" \
              "dist/unoskills-app-${{ matrix.artifact_suffix }}.exe" \
              "dist/unoskills-${{ matrix.artifact_suffix }}.exe"
          fi

      # ------------------------------------------------------------------ #
      # User-facing packaging (see packaging/ for per-platform templates). #
      # ------------------------------------------------------------------ #

      - name: Build UnoSkills.app and DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION="0.0.0"
          mkdir -p "dist/UnoSkills.app/Contents/MacOS" "dist/UnoSkills.app/Contents/Resources"
          cp "dist/unoskills-app-macos-arm64" "dist/UnoSkills.app/Contents/MacOS/unoskills-app"
          cp packaging/icons/unoskills.icns "dist/UnoSkills.app/Contents/Resources/AppIcon.icns"
          sed -e "s/@APP_VERSION@/${VERSION}/" \
              -e "s/@APP_BUILD@/${GITHUB_RUN_NUMBER}/" \
              packaging/macos/Info.plist > "dist/UnoSkills.app/Contents/Info.plist"
          plutil -lint "dist/UnoSkills.app/Contents/Info.plist"
          # Ad-hoc signature keeps the bundle self-consistent for local testing.
          # Replace with Developer ID signing + notarization when available.
          codesign --force --sign - "dist/UnoSkills.app"
          mkdir -p dist/dmg-root
          cp -R "dist/UnoSkills.app" dist/dmg-root/UnoSkills.app
          ln -sfh /Applications dist/dmg-root/Applications
          hdiutil create -volname UnoSkills -srcfolder dist/dmg-root \
            -format UDZO -ov "dist/unoskills-macos-arm64.dmg"

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION="0.0.0"
          mkdir -p dist/windows
          cp "dist/unoskills-app-windows-x64.exe" dist/windows/unoskills-app.exe
          cp "dist/unoskills-windows-x64.exe" dist/windows/unoskills.exe
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=${VERSION}" packaging/windows/unoskills.iss
          ls -la dist/

      - name: Build Debian package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION="0.0.0"
          # Auto-resolve runtime Depends from the NEEDED entries of the built
          # binaries against packages installed on this runner. Libraries that
          # are not installed here are skipped; extend packaging/linux/control
          # manually if users report missing runtime libraries.
          NEEDED=$( { objdump -p "target/${{ matrix.target }}/release/unoskills-app"; \
                      objdump -p "target/${{ matrix.target }}/release/unoskills"; } \
            | awk '/NEEDED/ {print $2}' | sort -u \
            | while read -r lib; do
                path=$(ldconfig -p | grep -F "$lib (" | head -1 | awk '{print $NF}')
                if [ -n "$path" ]; then
                  dpkg -S "$path" 2>/dev/null | head -1 | cut -d: -f1
                fi
              done | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "Auto-detected Depends: ${NEEDED:-none}"
          mkdir -p dist/deb-root/DEBIAN dist/deb-root/usr/bin \
            dist/deb-root/usr/share/applications \
            dist/deb-root/usr/share/icons/hicolor/256x256/apps
          install -m 0755 "target/${{ matrix.target }}/release/unoskills-app" dist/deb-root/usr/bin/unoskills-app
          install -m 0755 "target/${{ matrix.target }}/release/unoskills" dist/deb-root/usr/bin/unoskills
          install -m 0644 packaging/icons/unoskills-256.png dist/deb-root/usr/share/icons/hicolor/256x256/apps/unoskills.png
          install -m 0644 packaging/linux/unoskills.desktop dist/deb-root/usr/share/applications/unoskills.desktop
          sed -e "s/@APP_VERSION@/${VERSION}/" -e "s/@DEPENDS@/${NEEDED:-}/" \
            packaging/linux/control > dist/deb-root/DEBIAN/control
          dpkg-deb --root-owner-group --build dist/deb-root "dist/unoskills_${VERSION}_amd64.deb"
          dpkg-deb --info "dist/unoskills_${VERSION}_amd64.deb"

      - name: Clean staging directories
        shell: bash
        run: rm -rf dist/deb-root dist/dmg-root dist/windows dist/UnoSkills.app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact_suffix }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          tag = os.environ.get("GITHUB_REF_NAME", "").strip()
          changelog = pathlib.Path("CHANGELOG.md")
          notes = ""
          if changelog.is_file() and tag:
              text = changelog.read_text(encoding="utf-8")
              pattern = rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
              m = re.search(pattern, text, flags=re.MULTILINE | re.DOTALL)
              if m:
                  notes = m.group(1).strip()

          pathlib.Path("release-notes.md").write_text(notes + ("\n" if notes else ""), encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: release-assets/*

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  core-tests:
    name: Core & CLI Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Run unoskills-core unit tests
        run: cargo test -p unoskills-core --locked

      - name: Clippy core & CLI
        run: cargo clippy -p unoskills-core -p unoskills-cli --all-targets --locked -- -D warnings

  app-build:
    name: Desktop App Check & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux NSH dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libssl-dev

      - name: Clippy full workspace (zero warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run full workspace unit tests
        run: cargo test --workspace --locked

      - name: Build unoskills-app binary
        run: cargo build -p unoskills-app --locked

  cli-distribution:
    name: CLI Distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer failure cases
        run: sh packaging/cli/test-install.sh
      - name: Install the pinned CLI with Homebrew and curl
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv bash)"
          fi
          brew tap-new codexlin/tap --no-git
          cp packaging/homebrew-tap/Formula/unoskills.rb "$(brew --repository codexlin/tap)/Formula/"
          brew install codexlin/tap/unoskills
          brew test codexlin/tap/unoskills

          VERSION=$(brew info --json=v2 codexlin/tap/unoskills | jq -er '.formulae[0].versions.stable')
          sed "s/@RELEASE_TAG@/v$VERSION/" packaging/cli/install.sh > "$RUNNER_TEMP/install.sh"
          sh -n "$RUNNER_TEMP/install.sh"
          mkdir "$RUNNER_TEMP/unoskills-home"
          export HOME="$RUNNER_TEMP/unoskills-home"
          export UNOSKILLS_INSTALL_DIR="$HOME/bin"
          sh "$RUNNER_TEMP/install.sh"
          test "$("$UNOSKILLS_INSTALL_DIR/unoskills" --version)" = "unoskills $VERSION"

  ui:
    name: NSH UI Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSH v0.6.1
        run: |
          curl --fail --location --retry 3 --output nsh-linux-x86_64.tar.gz \
            https://github.com/longbridge/nsh/releases/download/v0.6.1/nsh-linux-x86_64.tar.gz
          echo "9a7ac692f1c229df476be8ff83a3c5912d271453b644e313f02cb19d18696070  nsh-linux-x86_64.tar.gz" | sha256sum --check
          tar -xzf nsh-linux-x86_64.tar.gz
          echo "$PWD/nsh/bin" >> "$GITHUB_PATH"
      - name: Check TSX
        run: nsh check crates/unoskills-app/ui
      - name: Bundle TSX
        run: nsh build crates/unoskills-app/ui --release
      - name: Test TSX headlessly
        run: nsh test crates/unoskills-app/ui --junit "$RUNNER_TEMP/nsh-results.xml"
      - name: Upload NSH test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nsh-test-results
          path: ${{ runner.temp }}/nsh-results.xml
          if-no-files-found: ignore
